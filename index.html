function callAPI(messages,maxTokens=3000){
return fetch("https://api.anthropic.com/v1/messages",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:maxTokens,messages})
}).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
.then(d=>{
if(d.error)throw new Error(d.error.message);
if(d.stop_reason==="max_tokens")throw new Error("TRUNCATED: response hit the "+maxTokens+"-token limit before finishing");
return d.content?.[0]?.text||"";
});
}

return null;
}

const canGo=(tab==="supplement"&&suppText.trim())||(tab==="meal"&&meal.trim());
return(
<div style={{maxWidth:560,margin:"0 auto",padding:"32px 20px 80px"}}>

<h2 style={{fontFamily:fd,fontSize:19,fontWeight:400,marginBottom:6}}>지금 먹는 것을 분석합니다</h2>
<p style={{fontSize:11,color:C.inkMuted,marginBottom:18,lineHeight:1.6}}>영양제 이름이나 성분을 입력하면 AI가 분석합니다.</p>
<div style={{display:"flex",gap:1,backgroundColor:C.border,borderRadius:6,overflow:"hidden",marginBottom:18}}>
{[{id:"supplement",l:"영양제 입력"},{id:"meal",l:"식사 입력"}].map(t=>(

))}
</div>
{tab==="supplement"&&<textarea value={suppText} onChange={e=>setSuppText(e.target.value)} placeholder={"지금 먹고 있는 영양제를 입력해주세요.\n\n예)\n- 오메가3 1000mg\n- 마그네슘 300mg\n- 칼슘+비타민D3\n- 루테인 20mg"} rows={7} style={{width:"100%",backgroundColor:C.bgCard,border:"1px solid "+C.border,borderRadius:8,padding:"12px 14px",fontSize:13,color:C.ink,resize:"none",lineHeight:1.7,marginBottom:14}}/>}
{tab==="meal"&&<textarea value={meal} onChange={e=>setMeal(e.target.value)} placeholder={"오늘 먹은 것을 자유롭게 입력해주세요.\n\n예)\n아침: 커피 한 잔\n점심: 냉면, 오징어볶음\n저녁: 아직 안 먹음"} rows={5} style={{width:"100%",backgroundColor:C.bgCard,border:"1px solid "+C.border,borderRadius:8,padding:"12px 14px",fontSize:13,color:C.ink,resize:"none",lineHeight:1.7,marginBottom:14}}/>}
<button onClick={analyze} disabled={loading||!canGo} style={{width:"100%",backgroundColor:canGo?C.gold:C.surface,color:canGo?C.bg:C.inkFaint,border:"none",borderRadius:6,padding:"11px",fontSize:11,letterSpacing:"0.12em",textTransform:"uppercase",fontWeight:700,transition:"all 0.2s",marginBottom:18}}>{loading?"분석 중...":"분석하기"}</button>
{loading&&<div style={{textAlign:"center",padding:"22px 0"}}><div style={{width:20,height:20,border:"2px solid "+C.border,borderTop:"2px solid "+C.gold,borderRadius:"50%",margin:"0 auto 9px",animation:"spin 1s linear infinite"}}/><div style={{fontSize:11,color:C.inkMuted}}>분석 중...</div></div>}
{sr&&!sr.error&&(

{sr.type==="supplement"&&(

<ICard ch={<div style={{fontSize:12,color:C.inkMuted,lineHeight:1.7}}>{sr.assessment}</div>}/>
{(sr.items||[]).map((it,i)=>(
<div key={i} style={{backgroundColor:C.bgCard,border:"1px solid "+(it.drugFlag?C.red:C.border),borderRadius:8,padding:"10px 13px",marginBottom:6,display:"flex",gap:8}}>

<div><div style={{fontSize:12,fontWeight:600,marginBottom:2}}>{it.name}</div><div style={{fontSize:10,color:C.inkMuted,lineHeight:1.5,marginBottom:2}}>{it.comment}</div><div style={{fontSize:9,color:C.gold}}>최적: {it.timing}</div></div>
</div>
))}
{sr.missing?.length>0&&<div style={{backgroundColor:C.greenFaint,border:"1px solid "+C.green,borderRadius:8,padding:"10px 13px",marginBottom:6}}><div style={{fontSize:8,textTransform:"uppercase",letterSpacing:"0.1em",color:C.greenLight,marginBottom:4}}>추가 권장</div>{sr.missing.map((m,i)=><div key={i} style={{fontSize:10,color:C.inkMuted,marginBottom:2}}>+ {m}</div>)}</div>}
{sr.schedule?.filter(s=>s.take?.length>0).length>0&&(<><SL c="최적 복용 스케줄"/>{sr.schedule.filter(s=>s.take?.length>0).map((s,i)=>(<div key={i} style={{display:"flex",gap:12,padding:"8px 0",borderBottom:"1px solid "+C.border}}><div style={{fontSize:8,color:C.gold,fontWeight:600,minWidth:58,paddingTop:1}}>{s.time}</div><div style={{fontSize:11,color:C.ink}}>{s.take.join(", ")}</div></div>))}</>)}
</>
)}
{sr.type==="meal"&&(
<>
<ICard ch={<div style={{fontSize:12,color:C.inkMuted,lineHeight:1.7}}>{sr.assessment}</div>}/>
{(sr.nutrients||[]).map((n,i)=>(<div key={i} style={{display:"flex",alignItems:"flex-start",gap:8,padding:"8px 0",borderBottom:"1px solid "+C.border}}><span style={{fontSize:8,fontWeight:700,color:sc(n.status),backgroundColor:sb(n.status),padding:"2px 6px",borderRadius:10,flexShrink:0,marginTop:2}}>{n.status}</span><div><div style={{fontSize:11,fontWeight:600}}>{n.name} <span style={{fontSize:9,color:C.inkFaint,fontWeight:400}}>{n.amount}</span></div><div style={{fontSize:10,color:C.inkMuted}}>{n.comment}</div></div></div>))}
{sr.avoid_today?.length>0&&<div style={{backgroundColor:C.redFaint,border:"1px solid "+C.red,borderRadius:8,padding:"10px 13px",marginTop:8,marginBottom:6}}><div style={{fontSize:8,textTransform:"uppercase",letterSpacing:"0.1em",color:C.red,marginBottom:4}}>오늘 피해야 할 것</div>{sr.avoid_today.map((a,i)=><div key={i} style={{fontSize:10,color:C.red,marginBottom:2}}>⚠ {a}</div>)}</div>}
{sr.supplementAdjust?.length>0&&<div style={{backgroundColor:C.goldFaint,border:"1px solid rgba(201,169,110,0.3)",borderRadius:8,padding:"10px 13px",marginBottom:6}}><div style={{fontSize:8,textTransform:"uppercase",letterSpacing:"0.1em",color:C.gold,marginBottom:4}}>오늘 루틴 조정</div>{sr.supplementAdjust.map((s,i)=><div key={i} style={{fontSize:10,color:C.inkMuted,marginBottom:2}}>· {s}</div>)}</div>}
{sr.mealTip&&<div style={{fontSize:10,color:C.inkFaint,padding:"8px 0",borderTop:"1px solid "+C.border,lineHeight:1.6}}>💡 {sr.mealTip}</div>}
</>
)}
</div>
)}
{sr?.error&&<div style={{backgroundColor:C.bgCard,border:"1px solid "+C.border,borderRadius:8,padding:"14px",textAlign:"center"}}><div style={{fontSize:12,color:C.inkMuted,marginBottom:4}}>분석 실패</div><div style={{fontSize:9,color:C.inkFaint,marginBottom:10}}>{sr.msg}</div><button onClick={()=>setSr(null)} style={{backgroundColor:C.surface,color:C.inkMuted,border:"1px solid "+C.border,borderRadius:4,padding:"6px 14px",fontSize:9}}>다시 시도</button></div>}
</div>

}
function Tracker({healthLog,addLog}){
const [scores,setScores]=useState({sleep:3,energy:3,mood:3,skin:3});const [saved,setSaved]=useState(false);
const today=new Date().toISOString().slice(0,10);const alreadyLogged=healthLog.some(l=>l.date===today);const last14=healthLog.slice(-14);
const metrics=[{key:"sleep",l:"수면",e:"🌙",col:C.blue},{key:"energy",l:"에너지",e:"⚡",col:C.gold},{key:"mood",l:"기분",e:"☀️",col:C.greenLight},{key:"skin",l:"피부",e:"✨",col:"#C4956A"}];
const avg=key=>last14.length?(last14.reduce((s,l)=>s+(l[key]||0),0)/last14.length).toFixed(1):"—";
return(
<div style={{maxWidth:520,margin:"0 auto",padding:"32px 20px 80px"}}>
<div style={{fontSize:9,letterSpacing:"0.18em",textTransform:"uppercase",color:C.gold,marginBottom:9,opacity:0.8}}>건강 지표</div>
<h2 style={{fontFamily:fd,fontSize:19,fontWeight:400,marginBottom:5}}>변화를 추적합니다</h2>
<p style={{fontSize:11,color:C.inkMuted,marginBottom:22,lineHeight:1.6}}>매일 기록할수록 루틴 효과가 보입니다.</p>
{last14.length>0&&(
<>
<SL c={"최근 "+last14.length+"일 평균"}/>
<div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6,marginBottom:20}}>
{metrics.map(m=>(<div key={m.key} style={{backgroundColor:C.bgCard,border:"1px solid "+C.border,borderRadius:8,padding:"11px 7px",textAlign:"center"}}><div style={{fontSize:14,marginBottom:3}}>{m.e}</div><div style={{fontFamily:fd,fontSize:19,color:m.col,lineHeight:1}}>{avg(m.key)}</div><div style={{fontSize:7,color:C.inkMuted,marginTop:3}}>{m.l}</div></div>))}
</div>
<SL c="추세"/>
{metrics.map(m=>{const vals=last14.map(l=>l[m.key]||0);return(
<div key={m.key} style={{marginBottom:12}}>
<div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4}}><span style={{fontSize:9}}>{m.e}</span><span style={{fontSize:9,color:C.inkMuted}}>{m.l}</span></div>
<div style={{display:"flex",alignItems:"flex-end",gap:2,height:32}}>{vals.map((v,i)=><div key={i} style={{flex:1,backgroundColor:m.col,borderRadius:"2px 2px 0 0",height:(v/5*100)+"%",minHeight:2,opacity:0.3+(i/vals.length)*0.7}}/>)}</div>
<div style={{display:"flex",justifyContent:"space-between",marginTop:2}}><div style={{fontSize:7,color:C.inkFaint}}>{last14[0]?.date?.slice(5)}</div><div style={{fontSize:7,color:C.inkFaint}}>{last14[last14.length-1]?.date?.slice(5)}</div></div>
</div>
);})}
</>
)}
<SL c="오늘 기록"/>
{alreadyLogged&&!saved?<div style={{backgroundColor:C.greenFaint,border:"1px solid "+C.green,borderRadius:8,padding:"11px 13px",fontSize:11,color:C.greenLight,marginBottom:14}}>✓ 오늘 이미 기록했습니다.</div>:(
<>
{metrics.map(m=>(<div key={m.key} style={{backgroundColor:C.bgCard,border:"1px solid "+C.border,borderRadius:8,padding:"12px 14px",marginBottom:6}}><div style={{display:"flex",alignItems:"center",gap:6,marginBottom:9}}><span style={{fontSize:12}}>{m.e}</span><span style={{fontSize:11,fontWeight:600}}>{m.l}</span><span style={{marginLeft:"auto",fontSize:12,fontWeight:600,color:m.col}}>{scores[m.key]} / 5</span></div><div style={{display:"flex",gap:4}}>{[1,2,3,4,5].map(n=>(<button key={n} onClick={()=>setScores(p=>({...p,[m.key]:n}))} style={{flex:1,height:28,borderRadius:4,border:"1px solid "+(scores[m.key]>=n?m.col:C.border),backgroundColor:scores[m.key]>=n?m.col+"22":C.surface,color:scores[m.key]>=n?m.col:C.inkFaint,fontSize:11,fontWeight:600,transition:"all 0.15s"}}>{n}</button>))}</div></div>))}
<button onClick={()=>{addLog(scores);setSaved(true);}} style={{width:"100%",backgroundColor:saved?C.green:C.gold,color:C.bg,border:"none",borderRadius:6,padding:"10px",fontSize:11,letterSpacing:"0.12em",textTransform:"uppercase",fontWeight:700,marginTop:3}}>{saved?"✓ 저장 완료":"오늘 기록 저장"}</button>
</>
)}
{healthLog.length===0&&<div style={{textAlign:"center",padding:"28px 0",color:C.inkFaint,fontSize:10,lineHeight:1.7}}>아직 기록이 없습니다.<br/>매일 기록하면 14일 후부터 추세가 보입니다.</div>}
</div>
);
}
function Dashboard({result}){
const items=(result?.products||[]).map((p,i)=>({id:i+1,label:p.name,time:p.timing}));
const [checked,setChecked]=useState({});const [feedback,setFeedback]=useState([]);const [note,setNote]=useState("");const [insight,setInsight]=useState("피드백을 남겨주세요. AI가 루틴을 조정합니다.");const [loadingIns,setLoadingIns]=useState(false);

if(!feedback.length&&!note)return;setLoadingIns(true);
try{const raw=await callAPI([{role:"user",content:"웰니스 코치로서 2-3문장으로 따뜻하고 전문적인 한국어 인사이트를 주세요. 루틴 조정 힌트 포함.\n피드백: "+feedback.join(", ")+(note?"\n메모: "+note:"")}],400);setInsight(raw||"피드백 감사합니다.");}catch{setInsight("피드백이 저장되었습니다.");}
setLoadingIns(false);
};
return(
<div style={{maxWidth:580,margin:"0 auto",padding:"30px 20px 80px"}}>
<div style={{fontFamily:fd,fontSize:19,marginBottom:2}}>오늘의 루틴</div>
<div style={{fontSize:9,color:C.inkMuted,marginBottom:18}}>{today}</div>
<div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:6,marginBottom:12}}>
{[{v:cnt+"/"+items.length,l:"오늘 완료"},{v:"14",l:"연속 일수"},{v:"87%",l:"이번 달"}].map((s,i)=>(<div key={i} style={{backgroundColor:C.bgCard,border:"1px solid "+C.border,borderRadius:8,padding:"11px 13px"}}><div style={{fontFamily:fd,fontSize:21,color:C.gold,lineHeight:1,marginBottom:3}}>{s.v}</div><div style={{fontSize:7,letterSpacing:"0.1em",textTransform:"uppercase",color:C.inkMuted}}>{s.l}</div></div>))}
</div>
<div style={{backgroundColor:C.bgCard,border:"1px solid "+C.border,borderRadius:10,padding:"13px 15px",marginBottom:9}}>
<div style={{fontSize:7,letterSpacing:"0.12em",textTransform:"uppercase",color:C.inkFaint,marginBottom:10}}>복용 체크</div>
{items.length===0&&<div style={{fontSize:11,color:C.inkFaint,textAlign:"center",padding:"12px 0"}}>진단을 완료하면 여기에 루틴이 표시됩니다.</div>}
{items.map((item,i)=>(<div key={item.id} onClick={()=>setChecked(p=>({...p,[item.id]:!p[item.id]}))} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderBottom:i<items.length-1?"1px solid "+C.border:"none",cursor:"pointer"}}><div style={{width:14,height:14,borderRadius:3,border:"2px solid "+(checked[item.id]?C.gold:C.inkFaint),backgroundColor:checked[item.id]?C.gold:"transparent",display:"flex",alignItems:"center",justifyContent:"center",transition:"all 0.2s",flexShrink:0}}>{checked[item.id]&&<svg width="7" height="5" viewBox="0 0 7 5" fill="none"><path d="M1 2.5L2.8 4.2L6 1" stroke={C.bg} strokeWidth="1.5" strokeLinecap="round"/></svg>}</div><div style={{fontSize:12,color:checked[item.id]?C.inkFaint:C.ink,textDecoration:checked[item.id]?"line-through":"none",transition:"all 0.2s",flex:1}}>{item.label}</div><div style={{fontSize:8,color:C.gold,opacity:0.7}}>{item.time}</div></div>))}
</div>
<div style={{backgroundColor:C.bgCard,border:"1px solid "+C.border,borderRadius:10,padding:"13px 15px",marginBottom:9}}>
<div style={{display:"flex",alignItems:"center",gap:6,marginBottom:7}}><div style={{width:5,height:5,borderRadius:"50%",backgroundColor:C.gold,animation:"pulse 2s ease infinite"}}/><div style={{fontSize:7,letterSpacing:"0.12em",textTransform:"uppercase",color:C.gold}}>AI 인사이트</div></div>
<div style={{fontSize:12,lineHeight:1.8,color:C.inkMuted}}>{loadingIns?"분석 중...":insight}</div>
</div>
<div style={{backgroundColor:C.surface,border:"1px solid "+C.border,borderRadius:10,padding:"13px 15px"}}>
<div style={{fontSize:11,fontWeight:600,marginBottom:4,color:C.goldLight}}>오늘 몸 상태는?</div>
<div style={{display:"flex",flexWrap:"wrap",gap:5,marginBottom:9}}>
{["잠이 좋아졌다","피부가 개선됐다","속이 편해졌다","에너지가 올랐다","관절이 편해졌다","두근거림 줄었다","변화 없음"].map(opt=>(<button key={opt} onClick={()=>setFeedback(p=>p.includes(opt)?p.filter(x=>x!==opt):[...p,opt])} style={{padding:"5px 10px",borderRadius:20,border:"1px solid "+(feedback.includes(opt)?C.gold:C.border),backgroundColor:feedback.includes(opt)?C.goldFaint:"transparent",color:feedback.includes(opt)?C.goldLight:C.inkMuted,fontSize:10,transition:"all 0.15s"}}>{opt}</button>))}
</div>
<textarea value={note} onChange={e=>setNote(e.target.value)} placeholder="직접 입력 (선택)..." rows={2} style={{width:"100%",backgroundColor:C.bgCard,border:"1px solid "+C.border,borderRadius:6,padding:"8px 11px",fontSize:11,color:C.ink,resize:"none",lineHeight:1.6}}/>
<div style={{marginTop:6,textAlign:"right"}}><button onClick={submit} style={{backgroundColor:C.gold,color:C.bg,border:"none",borderRadius:4,padding:"6px 16px",fontSize:9,letterSpacing:"0.1em",textTransform:"uppercase",fontWeight:700}}>전송</button></div>
</div>
</div>
);
}
const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>
