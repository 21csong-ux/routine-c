const BUCKETS=["아침","점심","저녁","취침 전"];
function bucketOf(time){
if(!time)return null;
if(time.includes("아침"))return "아침";
if(time.includes("점심"))return "점심";
if(time.includes("저녁"))return "저녁";
if(time.includes("취침"))return "취침 전";
return null;
}
function bucketRoutine(routine){
const map={"아침":[],"점심":[],"저녁":[],"취침 전":[]};
(routine||[]).forEach(r=>{
const b=bucketOf(r.time);
if(!b)return;
(r.items||[]).forEach(it=>map[b].push({text:it,tip:r.tip}));
});
return map;
}
function findProduct(products,itemText){
if(!products||!itemText)return null;
const norm=s=>(s||"").replace(/[0-9]/g,"").replace(/[^가-힣a-zA-Z]/g,"");
const it=norm(itemText);
if(!it)return null;
return products.find(p=>{const pn=norm(p.name);return pn&&(it.includes(pn)||pn.includes(it));})||null;
}
function dayTally(result,checked){
const buckets=bucketRoutine(result?.routine);
const tally={};
BUCKETS.forEach(b=>{
const items=buckets[b];
let done=0;
items.forEach((it,idx)=>{if(checked[b+"__"+idx])done++;});
tally[b]={done,total:items.length};
});
return tally;
}
function last7Dates(){
const arr=[];
for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);arr.push(d.toISOString().slice(0,10));}
return arr;
}
function dayPct(entry){
if(!entry)return null;
let done=0,total=0;
Object.values(entry.buckets||{}).forEach(b=>{done+=b.done;total+=b.total;});
if(total===0)return null;
return Math.round(done/total*100);
}
function computeStreak(doseHistory){
let streak=0;
for(let i=0;;i++){
const d=new Date();d.setDate(d.getDate()-i);
const key=d.toISOString().slice(0,10);
const entry=doseHistory[key];
if(!entry)break;
let done=0;Object.values(entry.buckets||{}).forEach(b=>done+=b.done);
if(done<=0)break;
streak++;
}
return streak;
}
function mostMissedBucket(doseHistory){
const agg={};BUCKETS.forEach(b=>agg[b]={done:0,total:0});
last7Dates().forEach(d=>{
const entry=doseHistory[d];if(!entry)return;
BUCKETS.forEach(b=>{const t=entry.buckets?.[b];if(t&&t.total>0){agg[b].done+=t.done;agg[b].total+=t.total;}});
});
let worst=null,worstRatio=1;
BUCKETS.forEach(b=>{if(agg[b].total>0){const ratio=agg[b].done/agg[b].total;if(ratio<worstRatio){worstRatio=ratio;worst=b;}}});
return (worst&&worstRatio<0.7)?worst:null;
}

function callAPI(messages,maxTokens=3000){
return fetch("https://api.anthropic.com/v1/messages",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:maxTokens,messages})
}).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
.then(d=>{
if(d.error)throw new Error(d.error.message);
if(d.stop_reason==="max_tokens")throw new Error("TRUNCATED: response hit the "+maxTokens+"-token limit before finishing");
return d.content?.[0]?.text||"";
});
}

return null;
}

<SL c={"최근 "+last14.length+"일 평균"}/>
<div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6,marginBottom:20}}>
{metrics.map(m=>(<div key={m.key} style={{backgroundColor:C.bgCard,border:"1px solid "+C.border,borderRadius:14,padding:"11px 7px",textAlign:"center",boxShadow:"0 1px 2px rgba(15,23,42,0.04)"}}><div style={{fontSize:14,marginBottom:3}}>{m.e}</div><div style={{fontFamily:fd,fontWeight:700,fontSize:19,color:m.col,lineHeight:1}}>{avg(m.key)}</div><div style={{fontSize:7,color:C.inkMuted,marginTop:3}}>{m.l}</div></div>))}
</div>
<SL c="추세"/>
{metrics.map(m=>{const vals=last14.map(l=>l[m.key]||0);return(
<div key={m.key} style={{marginBottom:12}}>
<div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4}}><span style={{fontSize:9}}>{m.e}</span><span style={{fontSize:9,color:C.inkMuted}}>{m.l}</span></div>
<div style={{display:"flex",alignItems:"flex-end",gap:2,height:32}}>{vals.map((v,i)=><div key={i} style={{flex:1,backgroundColor:m.col,borderRadius:"2px 2px 0 0",height:(v/5*100)+"%",minHeight:2,opacity:0.3+(i/vals.length)*0.7}}/>)}</div>
<div style={{display:"flex",justifyContent:"space-between",marginTop:2}}><div style={{fontSize:7,color:C.inkFaint}}>{last14[0]?.date?.slice(5)}</div><div style={{fontSize:7,color:C.inkFaint}}>{last14[last14.length-1]?.date?.slice(5)}</div></div>
</div>
);})}
</>
)}
<SL c="오늘 기록"/>
{alreadyLogged&&!saved?<div style={{backgroundColor:C.greenFaint,border:"1px solid "+C.green,borderRadius:14,padding:"11px 13px",fontSize:11,color:C.greenLight,marginBottom:14}}>✓ 오늘 이미 기록했습니다.</div>:(
<>
{metrics.map(m=>(<div key={m.key} style={{backgroundColor:C.bgCard,border:"1px solid "+C.border,borderRadius:16,padding:"12px 14px",marginBottom:6}}><div style={{display:"flex",alignItems:"center",gap:6,marginBottom:9}}><span style={{fontSize:12}}>{m.e}</span><span style={{fontSize:11,fontWeight:700}}>{m.l}</span><span style={{marginLeft:"auto",fontSize:12,fontWeight:700,color:m.col}}>{scores[m.key]} / 5</span></div><div style={{display:"flex",gap:4}}>{[1,2,3,4,5].map(n=>(<button key={n} onClick={()=>setScores(p=>({...p,[m.key]:n}))} style={{flex:1,height:28,borderRadius:8,border:"1px solid "+(scores[m.key]>=n?m.col:C.border),backgroundColor:scores[m.key]>=n?m.col+"22":C.surface,color:scores[m.key]>=n?m.col:C.inkFaint,fontSize:11,fontWeight:700,transition:"all 0.15s"}}>{n}</button>))}</div></div>))}
<button onClick={()=>{addLog(scores);setSaved(true);}} style={{width:"100%",backgroundColor:saved?C.greenLight:C.emerald,color:"#fff",border:"none",borderRadius:999,padding:"12px",fontSize:11,letterSpacing:"0.08em",fontWeight:700,marginTop:3,boxShadow:"0 6px 16px rgba(16,185,129,0.28)"}}>{saved?"✓ 저장 완료":"오늘 기록 저장"}</button>
</>
)}
{healthLog.length===0&&<div style={{textAlign:"center",padding:"28px 0",color:C.inkFaint,fontSize:10,lineHeight:1.7}}>아직 기록이 없습니다.<br/>매일 기록하면 14일 후부터 추세가 보입니다.</div>}
</div>
);
}
const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>
</body>
</html>
